spring.application.name=Delivery

logging.level.org.springframework.security=DEBUG
openrouteservice.api.key=${OPENROUTESERVICE_API_KEY}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.group-id=delivery-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.request-timeout-ms=120000
spring.kafka.producer.max-block-ms=120000
spring.kafka.producer.retries=3
spring.kafka.producer.retry-backoff-ms=1000
spring.kafka.producer.metadata.max.age.ms=300000
spring.kafka.properties.metadata.fetch.timeout.ms=180000
spring.kafka.producer.max.request.size=52428800
spring.kafka.producer.buffer.memory=67108864
spring.kafka.producer.batch.size=16384
spring.kafka.security.protocol=${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
spring.kafka.properties.sasl.mechanism=${KAFKA_SASL_MECHANISM:}
spring.kafka.properties.security.protocol=${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
spring.kafka.producer.close-timeout=30000  # Ensure graceful shutdown
delete.topic.enable=true


jwt.public.key=${JWT_PUBLIC_KEY:classpath:app.pub}
jwt.private.key=${JWT_PRIVATE_KEY:classpath:app.key}



spring.kafka.properties.sasl.jaas.config=${KAFKA_SASL_JAAS_CONFIG:}


# MongoDB configuration
spring.data.mongodb.database=${MONGODB_DATABASE}
spring.data.mongodb.uri=${MONGODB_URI}


# Server port
server.port=8081